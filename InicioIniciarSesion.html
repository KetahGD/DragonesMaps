<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b6b3a">
  <title>Dragones Maps | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=20260820-2">
  <link rel="stylesheet" href="assets/css/home.css?v=20260820-3">
  <link rel="stylesheet" href="assets/css/auth.css?v=20260821-4">
  <link rel="icon" type="image/x-icon" href="assets/images/branding/favicon.ico?v=20260820-2">
</head>
<body class="auth-page">
  <header class="simple-header">
    <a class="brand" href="index.html" aria-label="Dragones Maps"><span class="brand__images" aria-hidden="true"><img class="brand__symbol" src="assets/images/branding/dragon-logo-transparent.png" alt="" width="371" height="706"><span class="brand__text">DRAGONES MAPS</span></span><span class="sr-only">Dragones Maps</span></a>
    <a class="simple-link" href="index.html">Continuar sin cuenta</a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <a class="auth-back" href="Inicio.html" aria-label="Volver al inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Volver
      </a>
      <div class="auth-card__heading">
        <span class="auth-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>
        <p class="eyebrow">Cuenta opcional</p>
        <h1 id="auth-title">Bienvenido de nuevo</h1>
        <p>Inicia sesión con el correo que registraste.</p>
      </div>

      <button class="google-auth-button" type="button" data-google-signin>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.2c0-.7-.06-1.2-.2-1.75H12v3.32h5.37a4.6 4.6 0 0 1-2 3.02v2.15h3.24c1.9-1.75 2.74-4.32 2.74-6.74Z"/><path fill="#34A853" d="M12 21.7c2.7 0 4.98-.9 6.64-2.76l-3.24-2.15c-.9.6-2.05.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.22A10.03 10.03 0 0 0 12 21.7Z"/><path fill="#FBBC05" d="M6.39 13.62a6 6 0 0 1 0-3.83V7.57H3.04a10.03 10.03 0 0 0 0 8.27l3.35-2.22Z"/><path fill="#EA4335" d="M12 5.66c1.47 0 2.79.5 3.82 1.5l2.88-2.8A9.66 9.66 0 0 0 12 1.7a10.03 10.03 0 0 0-8.96 5.87l3.35 2.22C7.18 7.42 9.39 5.66 12 5.66Z"/></svg>
        <span>Continuar con Google</span>
      </button>
      <div class="auth-divider"><span>o usa tu correo</span></div>

      <form class="auth-form" data-auth-form="login" novalidate>
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" placeholder="ejemplo@correo.com" autocomplete="email" required>

        <div class="auth-form__label-row"><label for="password">Contraseña</label><button type="button" data-reset-password>¿La olvidaste?</button></div>
        <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6" required>

        <p class="form-status" data-auth-status role="status" hidden></p>
        <button class="primary-button primary-button--wide" type="submit" data-label="Iniciar sesión"><span>Iniciar sesión</span></button>
      </form>

      <p class="auth-switch">¿Aún no tienes cuenta? <a href="InicioCrearCuenta.html">Créala aquí</a></p>
    </section>
    <aside class="auth-visual" aria-hidden="true"><img src="assets/images/branding/dragon-logo-transparent.png" alt="" width="371" height="706"><p>Tu campus, más fácil de explorar.</p></aside>
  </main>

  <script type="module" src="assets/js/auth-forms.js?v=20260821-4"></script>
</body>
</html>
