<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b6b3a">
  <title>Dragones Maps | Restablecer contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=20260821-1">
  <link rel="stylesheet" href="assets/css/auth.css?v=20260821-1">
  <link rel="icon" type="image/x-icon" href="assets/images/branding/favicon.ico?v=20260820-2">
</head>
<body class="auth-page">
  <header class="simple-header">
    <a class="brand" href="index.html" aria-label="Dragones Maps"><span class="brand__images" aria-hidden="true"><img class="brand__symbol" src="assets/images/branding/dragon-logo-transparent.png" alt="" width="371" height="706"><span class="brand__text">DRAGONES MAPS</span></span><span class="sr-only">Dragones Maps</span></a>
    <a class="simple-link" href="index.html">Volver al mapa</a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <a class="auth-back" href="InicioIniciarSesion.html" aria-label="Volver a iniciar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Volver
      </a>
      <div class="auth-card__heading">
        <span class="auth-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3m-11 0h12v10H6V11Zm6 4v2"/></svg></span>
        <p class="eyebrow">Seguridad de la cuenta</p>
        <h1 id="auth-title">Crea una contraseña nueva</h1>
        <p>Abre esta página desde el enlace que recibiste por correo.</p>
      </div>

      <p class="form-status" data-password-recovery-status role="status">Validando el enlace…</p>
      <form class="auth-form" data-password-recovery-form hidden novalidate>
        <label for="password">Nueva contraseña</label>
        <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required>

        <label for="confirmar">Confirmar contraseña</label>
        <input id="confirmar" name="confirmar" type="password" placeholder="Repite tu contraseña" autocomplete="new-password" minlength="6" required>

        <button class="primary-button primary-button--wide" type="submit"><span>Guardar contraseña</span></button>
      </form>
      <p class="auth-switch" data-login-link hidden><a href="InicioIniciarSesion.html">Ir a iniciar sesión</a></p>
    </section>
    <aside class="auth-visual" aria-hidden="true"><img src="assets/images/branding/dragon-logo-transparent.png" alt="" width="371" height="706"><p>Tu cuenta, protegida y lista para continuar.</p></aside>
  </main>

  <script type="module" src="assets/js/password-recovery.js?v=20260821-1"></script>
</body>
</html>
